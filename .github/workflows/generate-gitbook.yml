name: Generate GitBook

on:
  push:
    branches: [main]
    paths:
      - 'data/articles.json'
      - 'scripts/generate-gitbook.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate GitBook documents
        run: node scripts/generate-gitbook.mjs
      - name: Commit generated documents
        shell: bash
        run: |
          if git diff --quiet -- docs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs
          git commit -m "docs: regenerate GitBook archive"
          git push
